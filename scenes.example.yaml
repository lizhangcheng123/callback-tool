# 场景配置示例文件
# 复制为 scenes.yaml 并根据实际需求修改

# 环境配置 - 定义不同环境的 base_url
environments:
  dev:
    base_url: "http://localhost:8080"
  test:
    base_url: "https://test-api.example.com"
    callback_base_url: "https://callback-test.ycloud.com"
    sls_project: "ycloud-k8s-service-test"
  staging:
    base_url: "https://staging-api.example.com"
  prod:
    base_url: "https://api.example.com"

# 单个场景定义
scenes:
  # 支付成功回调示例
  payment-success:
    name: "支付成功回调"
    description: "模拟第三方支付成功通知"
    url: "{{base_url}}/api/payment/notify"
    method: POST
    headers:
      Content-Type: "application/json"
      X-Signature: "{{signature|default:mock-signature}}"
    body: |
      {
        "orderId": "{{orderId}}",
        "status": "SUCCESS",
        "amount": {{amount}},
        "paymentId": "PAY{{_timestamp_ms}}",
        "timestamp": "{{_now}}"
      }
    defaults:
      orderId: "ORD000"
      amount: 9900

  # 支付失败回调示例
  payment-failed:
    name: "支付失败回调"
    description: "模拟第三方支付失败通知"
    url: "{{base_url}}/api/payment/notify"
    method: POST
    headers:
      Content-Type: "application/json"
    body: |
      {
        "orderId": "{{orderId}}",
        "status": "FAILED",
        "errorCode": "{{errorCode|default:INSUFFICIENT_BALANCE}}",
        "timestamp": "{{_now}}"
      }
    defaults:
      orderId: "ORD000"

  # 物流发货回调示例
  logistics-shipped:
    name: "物流发货回调"
    description: "模拟物流公司发货通知"
    url: "{{base_url}}/api/logistics/notify"
    method: POST
    headers:
      Content-Type: "application/json"
    body: |
      {
        "orderId": "{{orderId}}",
        "trackingNo": "{{trackingNo|default:SF1234567890}}",
        "carrier": "{{carrier|default:SF}}",
        "status": "SHIPPED",
        "timestamp": "{{_now}}"
      }
    defaults:
      orderId: "ORD000"

  # 物流签收回调示例
  logistics-delivered:
    name: "物流签收回调"
    description: "模拟物流公司签收通知"
    url: "{{base_url}}/api/logistics/notify"
    method: POST
    headers:
      Content-Type: "application/json"
    body: |
      {
        "orderId": "{{orderId}}",
        "trackingNo": "{{trackingNo|default:SF1234567890}}",
        "status": "DELIVERED",
        "signedBy": "{{signedBy|default:本人签收}}",
        "timestamp": "{{_now}}"
      }
    defaults:
      orderId: "ORD000"

  # 退款成功回调示例
  refund-success:
    name: "退款成功回调"
    description: "模拟第三方支付退款成功通知"
    url: "{{base_url}}/api/refund/notify"
    method: POST
    headers:
      Content-Type: "application/json"
    body: |
      {
        "orderId": "{{orderId}}",
        "refundId": "REF{{_timestamp_ms}}",
        "status": "SUCCESS",
        "amount": {{refundAmount|default:9900}},
        "timestamp": "{{_now}}"
      }
    defaults:
      orderId: "ORD000"

  # httpbin 测试场景 - 用于验证服务是否正常工作
  httpbin-test:
    name: "httpbin 测试"
    description: "使用 httpbin.org 测试 HTTP 请求"
    url: "https://httpbin.org/post"
    method: POST
    headers:
      Content-Type: "application/json"
      X-Custom-Header: "{{customHeader|default:test-value}}"
    body: |
      {
        "message": "{{message|default:Hello from callback-tool}}",
        "timestamp": "{{_now}}"
      }
    defaults:
      message: "Hello from callback-tool"

  whatsapp-message:
    name: "WhatsApp 消息回调"
    description: "模拟 WhatsApp 用户发送消息，并在 SLS 中验证 callback 服务收到日志"
    url: "{{callback_base_url|default:https://callback-test.ycloud.com}}/webhooks/attila/whatsapp/official/authen"
    method: POST
    headers:
      Content-Type: "application/json"
    body: |
      {
        "object": "whatsapp_business_account",
        "entry": [
          {
            "id": "{{waba_id}}",
            "changes": [
              {
                "value": {
                  "messaging_product": "whatsapp",
                  "metadata": {
                    "display_phone_number": "{{display_phone_number}}",
                    "phone_number_id": "{{phone_number_id}}"
                  },
                  "contacts": [
                    {
                      "profile": {"name": "{{sender_name}}"},
                      "wa_id": "{{sender_wa_id}}"
                    }
                  ],
                  "messages": [
                    {
                      "from": "{{sender_wa_id}}",
                      "id": "wamid.TEST{{_timestamp_ms}}",
                      "timestamp": "{{_timestamp}}",
                      "text": {"body": "{{message_body}}"},
                      "type": "text"
                    }
                  ]
                },
                "field": "messages"
              }
            ]
          }
        ]
      }
    defaults:
      waba_id: "131397483397268"
      display_phone_number: "8618362614551"
      phone_number_id: "238039826068779"
      sender_name: "测试用户"
      sender_wa_id: "8613806691211"
      message_body: "你好"
    verify:
      project: "{{sls_project|default:ycloud-k8s-service-test}}"
      logstore: "ycloud-attila-callback-root"
      query: "{{sender_wa_id}}"
      from_time: "5 minutes ago"
      to_time: "now"
      endpoint: "ap-southeast-1.log.aliyuncs.com"
      profile: "default"
      max_results: 20
      wait_seconds: 2

# 批量场景定义 - 按顺序执行多个场景
scenarios:
  # 完整订单流程
  full-order-flow:
    name: "完整订单流程"
    description: "模拟订单从支付到签收的完整流程"
    steps:
      - scene: payment-success
        delay_after: 1.0
      - scene: logistics-shipped
        delay_after: 2.0
      - scene: logistics-delivered

  # 支付后退款流程
  payment-refund-flow:
    name: "支付后退款流程"
    description: "模拟支付成功后用户申请退款"
    steps:
      - scene: payment-success
        delay_after: 1.0
      - scene: refund-success
